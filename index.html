<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><meta name="theme-color" content="#e8eee7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Wochenbuch"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Mein Wochenbuch</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#31473b;background:#e8eee7;font-synthesis:none}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{position:fixed;inset:0}button,textarea{font:inherit}button{cursor:pointer}.app{height:100dvh;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 12px);max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 5px 12px}.eyebrow{font-size:10px;letter-spacing:2px;color:#728a78;font-weight:700}.heading{font-size:clamp(16px,3.6vw,23px);font-weight:700;line-height:1.3;margin-top:3px}.controls{display:flex;gap:5px}.controls button{border:1px solid #c7d6c7;background:#fbfcf8;border-radius:10px;color:#45624f;padding:8px 11px;min-height:38px}.book{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;min-height:0;perspective:1300px;touch-action:none;overscroll-behavior:none;user-select:none}.sheet{background:#fffdf7;border-radius:14px;box-shadow:0 4px 18px #3246351b;display:flex;flex-direction:column;gap:8px;padding:10px 8px;position:relative;min-width:0;transform-style:preserve-3d}.sheet.left{border-radius:15px 5px 5px 15px}.sheet.right{border-radius:5px 15px 15px 5px}.spine{position:absolute;z-index:3;left:50%;top:8px;bottom:8px;width:10px;transform:translateX(-50%);pointer-events:none;background:linear-gradient(90deg,#9eafa12a,#506b5824,#fff9);border-radius:8px}.rings{position:absolute;z-index:4;left:50%;top:7%;bottom:7%;display:flex;flex-direction:column;justify-content:space-around;transform:translateX(-50%);pointer-events:none}.ring{width:19px;height:9px;border:2px solid #a2afa4;border-radius:50%;background:linear-gradient(#f5f6f0,#cfd9d0);box-shadow:0 1px 2px #61726355}.day{flex:1;display:flex;min-height:0;border:1px solid #e5ebe1;border-radius:8px;overflow:hidden;background:linear-gradient(#ffffffef,#ffffffef),repeating-linear-gradient(to bottom,transparent 0,transparent 24px,#dfe8dd 25px)}.tab{width:27px;flex-shrink:0;background:#dbe9de;color:#44604d;display:flex;align-items:center;flex-direction:column;gap:3px;padding:9px 1px;font-size:10px;font-weight:700}.tab .num{font-size:13px}.day.weekend .tab{background:#efdfce}.day textarea{width:100%;min-width:0;height:100%;border:0;outline:0;resize:none;background:transparent;color:#334b3b;padding:4px 5px;line-height:16px;font-size:13px;user-select:text;-webkit-user-select:text}.day textarea{touch-action:none;-webkit-overflow-scrolling:touch}.day textarea::placeholder{color:#b7c4b8}.hint{text-align:center;font-size:11px;color:#718877;margin:11px 0 0}.flip-layer{position:absolute;z-index:6;top:0;bottom:0;width:calc(50% - 5px);pointer-events:none;transform-style:preserve-3d;display:none}.flip-layer.next{right:0;transform-origin:left center}.flip-layer.prev{left:0;transform-origin:right center}.flip-face{position:absolute;inset:0;background:#fffdf7;backface-visibility:hidden;border-radius:9px;box-shadow:0 6px 24px #293d3240}.flip-back{transform:rotateY(180deg);background:linear-gradient(90deg,#e7eee3,#fffdf7 25%)}.flip-front{background:linear-gradient(90deg,#fffdf7 72%,#d2ddcf);display:flex;justify-content:center;align-items:center;color:#9eaf9e;font-size:15px}.flip-layer.prev .flip-front{background:linear-gradient(90deg,#d2ddcf,#fffdf7 28%)}.book.flipping .sheet{filter:brightness(.97)}.book.flipping .flip-layer{display:block}.status{font-size:11px;text-align:center;color:#748a78;padding-top:7px}@media(min-width:720px){.app{padding-left:26px;padding-right:26px}.book{gap:17px}.sheet{padding:18px;gap:12px}.tab{width:46px;font-size:13px}.tab .num{font-size:17px}.day textarea{padding:8px;font-size:16px;line-height:19px}.spine,.rings{left:50%}}@media(max-height:690px){.book{min-height:0}.app{padding-top:5px}.top{padding-bottom:7px}.hint{margin-top:6px}}@media(prefers-reduced-motion:reduce){.flip-layer{display:none!important}}
</style></head><body><main class="app"><header class="top"><div><div class="eyebrow">MEIN WOCHENBUCH</div><div class="heading" id="heading"></div></div><nav class="controls"><button id="prev" aria-label="Vorherige Woche">‹</button><button id="today">Heute</button><button id="next" aria-label="Nächste Woche">›</button></nav></header><section class="book" id="book" aria-label="Wochenkalender"><div class="sheet left" id="left"></div><div class="sheet right" id="right"></div><div class="spine"></div><div class="rings"><i class="ring"></i><i class="ring"></i><i class="ring"></i><i class="ring"></i><i class="ring"></i></div><div class="flip-layer next" id="flipNext"><div class="flip-face flip-front">✦</div><div class="flip-face flip-back"></div></div><div class="flip-layer prev" id="flipPrev"><div class="flip-face flip-front">✦</div><div class="flip-face flip-back"></div></div></section><div class="hint">Über die ganze Seite wischen, um die Woche zu wechseln</div><div class="status" id="status">Einträge werden auf diesem Gerät automatisch gespeichert.</div></main><script>
(()=>{'use strict';const labels=['Mo','Di','Mi','Do','Fr','Sa','So'],book=document.getElementById('book'),left=document.getElementById('left'),right=document.getElementById('right'),heading=document.getElementById('heading'),status=document.getElementById('status');let offset=0,flipping=false,gesture=null;const base=new Date();base.setHours(12,0,0,0);base.setDate(base.getDate()-(base.getDay()+6)%7);const dateAt=i=>{const d=new Date(base);d.setDate(d.getDate()+offset*7+i);return d};const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const fmt=d=>d.toLocaleDateString('de-DE',{day:'numeric',month:'long'});function render(){heading.textContent=`${fmt(dateAt(0))} – ${fmt(dateAt(6))} ${dateAt(6).getFullYear()}`;[left,right].forEach((page,p)=>{page.replaceChildren();(p===0?[0,1,2]:[3,4,5,6]).forEach(i=>{const d=dateAt(i),k='wochenbuch:'+key(d),day=document.createElement('div');day.className='day'+(i>4?' weekend':'');const tab=document.createElement('div');tab.className='tab';const weekday=document.createElement('span');weekday.textContent=labels[i];const num=document.createElement('span');num.className='num';num.textContent=d.getDate();tab.append(weekday,num);const ta=document.createElement('textarea');ta.placeholder='Schreiben …';ta.setAttribute('aria-label',`${d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})} – Notizen`);ta.value=localStorage.getItem(k)||'';ta.addEventListener('input',()=>{try{localStorage.setItem(k,ta.value);status.textContent='Automatisch auf diesem Gerät gespeichert.'}catch(e){status.textContent='Speichern nicht möglich – bitte Speicherplatz prüfen.'}});day.append(tab,ta);page.append(day)})})}
function pageFlip(direction){if(flipping)return;flipping=true;document.activeElement?.blur?.();const layer=document.getElementById(direction>0?'flipNext':'flipPrev');book.classList.add('flipping');layer.style.transition='none';layer.style.transform='rotateY(0deg)';layer.getBoundingClientRect();requestAnimationFrame(()=>{layer.style.transition='transform 340ms cubic-bezier(.2,.75,.25,1)';layer.style.transform=`rotateY(${direction>0?'-180':'180'}deg)`});setTimeout(()=>{offset+=direction;render();book.classList.remove('flipping');layer.style.transition='none';layer.style.transform='rotateY(0deg)';flipping=false},360)}
document.getElementById('prev').onclick=()=>pageFlip(-1);document.getElementById('next').onclick=()=>pageFlip(1);document.getElementById('today').onclick=()=>{offset=0;render()};
let touch=null;
book.addEventListener('touchstart',e=>{if(e.touches.length===1)touch={x:e.touches[0].clientX,y:e.touches[0].clientY,dx:0,dy:0};else touch=null},{passive:true});
book.addEventListener('touchmove',e=>{if(!touch||e.touches.length!==1)return;touch.dx=e.touches[0].clientX-touch.x;touch.dy=e.touches[0].clientY-touch.y;if(Math.abs(touch.dx)>10&&Math.abs(touch.dx)>Math.abs(touch.dy)*1.1)e.preventDefault()},{passive:false});
book.addEventListener('touchend',e=>{if(!touch)return;const t=touch;touch=null;if(Math.abs(t.dx)>42&&Math.abs(t.dx)>Math.abs(t.dy)*1.15)pageFlip(t.dx<0?1:-1)},{passive:true});book.addEventListener('touchcancel',()=>touch=null);
let mouseX=null;book.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')mouseX=e.clientX});book.addEventListener('pointerup',e=>{if(mouseX!==null){const dx=e.clientX-mouseX;mouseX=null;if(Math.abs(dx)>70)pageFlip(dx<0?1:-1)}});
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});})();
</script></body></html>
