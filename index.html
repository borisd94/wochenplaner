:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#31473b;background:#e8eee7;font-synthesis:none}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{position:fixed;inset:0}button,textarea{font:inherit}button{cursor:pointer}.app{height:100dvh;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 12px);max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 5px 12px}.eyebrow{font-size:10px;letter-spacing:2px;color:#728a78;font-weight:700}.heading{font-size:clamp(16px,3.6vw,23px);font-weight:700;line-height:1.3;margin-top:3px}.controls{display:flex;gap:5px}.controls button{border:1px solid #c7d6c7;background:#fbfcf8;border-radius:10px;color:#45624f;padding:8px 11px;min-height:38px}.book{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;min-height:0;perspective:1300px;touch-action:none;overscroll-behavior:none;user-select:none}.sheet{background:#fffdf7;border-radius:14px;box-shadow:0 4px 18px #3246351b;display:flex;flex-direction:column;gap:8px;padding:10px 8px;position:relative;min-width:0;transform-style:preserve-3d}.sheet.left{border-radius:15px 5px 5px 15px}.sheet.right{border-radius:5px 15px 15px 5px}.spine{position:absolute;z-index:9;left:50%;top:8px;bottom:8px;width:10px;transform:translateX(-50%);pointer-events:none;background:linear-gradient(90deg,#9eafa12a,#506b5824,#fff9);border-radius:8px}.rings{position:absolute;z-index:10;left:50%;top:7%;bottom:7%;display:flex;flex-direction:column;justify-content:space-around;transform:translateX(-50%);pointer-events:none}.ring{width:19px;height:9px;border:2px solid #a2afa4;border-radius:50%;background:linear-gradient(#f5f6f0,#cfd9d0);box-shadow:0 1px 2px #61726355}.day{flex:1;display:flex;min-height:0;border:1px solid #e5ebe1;border-radius:8px;overflow:h </style></head><body><main class="app"><header class="top"><div><div class="eyebrow">MEIN WOCHENBUCH</div><div class="heading" id="heading"></div></div><nav class="controls"><button id="prev" aria-label="Vorherige Woche">‹</button><button id="today">Heute</button><button id="next" aria-label="Nächste Woche">›</button></nav></header><section class="book" id="book" aria-label="Wochenkalender"><div class="sheet left" id="left"></div><div class="sheet right" id="right"></div><div class="underpage left" id="underLeft"></div><div class="underpage right" id="underRight"></div><div class="under-shadow"></div><div class="spine"></div><div class="rings"><i class="ring"></i><i class="ring"></i><i class="ring"></i><i class="ring"></i><i class="ring"></i></div><div class="flip-layer next" id="flipNext"><div class="flip-face flip-front"></div><div class="flip-face flip-back"></div></div><div class="flip-layer prev" id="flipPrev"><div class="flip-face flip-front"></div><div class="flip-face flip-back"></div></div></section><div class="hint">Seite mit dem Daumen ziehen und loslassen</div><div class="status" id="status">Einträge werden auf diesem Gerät automatisch gespeichert.</div></main><script>
(()=>{'use strict';
const labels=['Mo','Di','Mi','Do','Fr','Sa','So'];
const book=document.getElementById('book'),left=document.getElementById('left'),right=document.getElementById('right');
const heading=document.getElementById('heading'),status=document.getElementById('status');
const layers={1:document.getElementById('flipNext'),'-1':document.getElementById('flipPrev')};const underLeft=document.getElementById('underLeft'),underRight=document.getElementById('underRight');
let offset=0,gesture=null,turn=null,anim=0;
const base=new Date();base.setHours(12,0,0,0);base.setDate(base.getDate()-(base.getDay()+6)%7);
const dateAt=(i,w=offset)=>{const d=new Date(base);d.setDate(d.getDate()+w*7+i);return d};
const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmt=d=>d.toLocaleDateString('de-DE',{day:'numeric',month:'long'});
function makeSheet(indices,w,side){const sheet=document.createElement('div');sheet.className='sheet '+side;
 indices.forEach(i=>{const d=dateAt(i,w),k='wochenbuch:'+key(d),day=document.createElement('div');day.className='day'+(i>4?' weekend':'');
 const tab=document.createElement('div');tab.className='tab';const weekday=document.createElement('span');weekday.textContent=labels[i];const num=document.createElement('span');num.className='num';num.textContent=d.getDate();tab.append(weekday,num);
 const ta=document.createElement('textarea');ta.placeholder='Schreiben …';ta.setAttribute('aria-label',`${d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})} – Notizen`);
 ta.value=localStorage.getItem(k)||'';ta.addEventListener('input',()=>{try{localStorage.setItem(k,ta.value);status.textContent='Automatisch auf diesem Gerät gespeichert.'}catch(e){status.textContent='Speichern nicht möglich – bitte Speicherplatz prüfen.'}});
 day.append(tab,ta);sheet.append(day)});return sheet}
function snapshot(sheet){const copy=sheet.cloneNode(true);copy.querySelectorAll('textarea').forEach((ta,i)=>{const text=document.createElement('div');text.className='snapshot-text';text.textContent=sheet.querySelectorAll('textarea')[i].value;ta.replaceWith(text)});return copy}
function fill(el,indices,w,side){el.replaceChildren(...makeSheet(indices,w,side).childNodes)}
function render(){heading.textContent=`${fmt(dateAt(0))} – ${fmt(dateAt(6))} ${dateAt(6).getFullYear()}`;fill(left,[0,1,2],offset,'left');fill(right,[3,4,5,6],offset,'right')}
function showTurn(dir){if(turn)return;
 const layer=layers[dir],target=offset+dir;
 const front=dir===1?snapshot(right):snapshot(left);
 const back=dir===1?snapshot(makeSheet([0,1,2],target,'left')):snapshot(makeSheet([3,4,5,6],target,'right'));
 layer.querySelector('.flip-front').replaceChildren(front);layer.querySelector('.flip-back').replaceChildren(back);

function setProgress(p){if(!turn)return;p=Math.max(0,Math.min(1,p));turn.progress=p;
 turn.layer.style.transform=`rotateY(${turn.dir===1?-180*p:180*p}deg)`;
 underLeft.style.visibility=(turn.dir===-1||p>.5)?'visible':'hidden';
 underRight.style.visibility=(turn.dir===1||p>.5)?'visible':'hidden';
 turn.layer.style.setProperty('--shade',String(.12+.55*Math.sin(Math.PI*p)));
 book.style.setProperty('--under-opacity',String(.1+.7*Math.sin(Math.PI*p)))}
function finish(commit){if(!turn)return;const t=turn;turn=null;book.classList.remove('flipping');t.layer.style.transform='';t.layer.querySelector('.flip-front').replaceChildren();t.layer.querySelector('.flip-back').replaceChildren();book.style.removeProperty('--under-opacity');underLeft.style.visibility='hidden';underRight.style.visibility='hidden';underLeft.replaceChildren();underRight.replaceChildren();if(commit)offset+=t.dir;render()}
function animateTo(goal){if(!turn)return;cancelAnimationFrame(anim);const from=turn.progress,delta=goal-from,start=performance.now(),duration=Math.max(140,Math.abs(delta)*340);
 const tick=now=>{if(!turn)return;const t=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-t,3);setProgress(from+delta*ease);if(t<1)anim=requestAnimationFrame(tick);else finish(goal===1)};anim=requestAnimationFrame(tick)}
function buttonFlip(dir){if(turn)return;showTurn(dir);animateTo(1)}
document.getElementById('prev').onclick=()=>buttonFlip(-1);document.getElementById('next').onclick=()=>buttonFlip(1);
document.getElementById('today').onclick=()=>{if(turn)return;offset=0;render()};
// Capture touches before the editable textareas handle them. Keep the DOM under
// the finger intact and update the turning page on EVERY move, not on release.
const activeTouches=new Map();
function beginTouch(e){

}
function moveTouch(e){

   if(Math.abs(dx)<12||Math.abs(dx)<Math.abs(dy)*1.15)return;
   g.dir=dx<0?1:-1;g.active=true;

   // the user has clearly started a horizontal page-turn gesture.

 // One page-width of travel is one complete turn. No easing while dragging.

 setProgress(Math.min(1,Math.abs(dx)/travel));
}
function endTouch(e){
 if(!gesture)return;

// bubbling touchmove events. These listeners survive movement over overlays.
document.addEventListener('touchstart',beginTouch,{capture:true,passive:true});
document.addEventListener('touchmove',moveTouch,{capture:true,passive:false});

let mouse=null;book.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||turn)return;mouse={x:e.clientX,y:e.clientY,active:false}});
window.addEventListener('pointermove',e=>{if(!mouse)return;const dx=e.clientX-mouse.x,dy=e.clientY-mouse.y;if(!mouse.active&&Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){mouse.active=true;showTurn(dx<0?1:-1)}if(mouse.active&&turn)setProgress(Math.abs(dx)/Math.max(120,book.clientWidth*.68))});
window.addEventListener('pointerup',()=>{if(!mouse)return;const was=mouse.active;mouse=null;if(was&&turn)animateTo(turn.progress>.3?1:0)});
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
